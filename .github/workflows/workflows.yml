name: 🚀 Backend Build Process

on:
  push:
    branches:
      - in-dev

permissions:
  contents: write  # Enables pushing git tags
  packages: write  # Required for Docker Hub login (if using GHCR)
  id-token: write  # Required for some login actions

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Git user
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Create and push tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag build-${{ github.run_number }}
          git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }} build-${{ github.run_number }}

      - name: Restore Maven cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean package -DskipTests=false

      - name: Run unit tests
        run: mvn test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: docker build -t solomon11/cloud:latest .

      - name: Tag Docker image with SHA
        run: docker tag solomon11/cloud:latest solomon11/cloud:${{ github.sha }}

      - name: Push Docker images to Docker Hub
        run: |
          docker push solomon11/cloud:latest
          docker push solomon11/cloud:${{ github.sha }}

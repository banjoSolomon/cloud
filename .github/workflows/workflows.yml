name: Backend Build Process

on:
  push:
    branches:
      - in-dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Tag the commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git tag build-${{ github.run_number }}
          git push origin build-${{ github.run_number }}

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Restore Maven Packages
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile the code (build with Maven)
        run: mvn clean package -DskipTests=false

      - name: Run Unit Tests
        run: mvn test

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t solomon11/cloud:latest .

      - name: Tag Docker Image
        run: docker tag solomon11/cloud:latest solomon11/cloud:${{ github.sha }}

      - name: Push Docker Image to Docker Hub
        run: |
          docker push solomon11/cloud:latest
          docker push solomon11/cloud:${{ github.sha }}

      - name: Send Build Notification
        run: echo "✅ Build and Docker push completed for commit ${{ github.sha }} and tag build-${{ github.run_number }}"
